[package]
name = "afudesk_core"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "AfuDesk çekirdeği: tek kodla, ayarsız (doğrudan / NAT delme / relay) bağlanan uzak masaüstü"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
iroh = "1.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
log = "0.4"
rayon = "1"
dirs = "6"

[target.'cfg(not(target_os = "android"))'.dependencies]
xcap = "0.9"
enigo = "0.6"
gilrs = "0.11"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }


[features]
# Yalnız WAN test düzeneği (examples/wan_test.rs): iroh'un kararsız yol seçici API'si.
wan_testi = ["iroh/unstable-custom-transports"]

[[example]]
name = "wan_test"
required-features = ["wan_testi"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
