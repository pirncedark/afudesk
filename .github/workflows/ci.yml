name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      wan:
        description: "boş = tüm CI | windows/linux/ubuntu24 | derle/baglan = WAN"
        required: false
        default: ""
      derleme_run:
        description: "baglan için: derle çalışmasının run id'si"
        required: false
        default: ""
      sadece_relay:
        description: "baglan için: 1 = izleyicide doğrudan UDP kapalı (TEST-2)"
        required: false
        default: ""

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.wan == '' || inputs.wan == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arka plan betikleri söz dizimi (çalıştırılmaz)
        shell: pwsh
        run: |
          foreach ($path in 'scripts/arka_plan_kur.ps1', 'scripts/arka_plan_kaldir.ps1') {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
            Write-Output "PASS: $path"
          }
      - name: MSVC ortamı
        uses: ilammy/msvc-dev-cmd@v1
      - name: Windows DPAPI testleri
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX /DNOMINMAX app/windows/runner/google_secure_storage.cpp app/windows/tests/google_secure_storage_test.cpp /Fe:google_secure_storage_test.exe /link crypt32.lib shell32.lib ole32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./google_secure_storage_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
      - name: Rust çekirdek testleri
        working-directory: rust
        # Gerçek ekran/girdi testleri CI'da (ekransız oturum) atlanır.
        run: cargo test --release -- --skip gercek_
      - name: Flutter analiz + arayüz testleri
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Windows derleme
        working-directory: app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: AfuDesk-windows-x64
          path: app/build/windows/x64/runner/Release/

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.wan == '' || inputs.wan == 'linux' || inputs.wan == 'ubuntu24' }}
    runs-on: ${{ inputs.wan == 'ubuntu24' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Linux kanıt dizini
        run: |
          mkdir -p reports/linux-ci
          cat /etc/os-release > reports/linux-ci/runner-os.txt
          uname -m >> reports/linux-ci/runner-os.txt
      - name: Linux derleme ve X11 test bağımlılıkları
        timeout-minutes: 8
        run: bash scripts/linux/ci-dependencies.sh 2>&1 | tee reports/linux-ci/dependencies.log
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
      - name: Linux betik söz dizimi
        run: |
          mkdir -p reports/linux-ci
          bash -n scripts/linux/*.sh
          python3 -m py_compile scripts/linux/input_receiver.py
      - name: Rust çekirdek testleri (ekransız)
        working-directory: rust
        run: cargo test --release -- --skip gercek_ 2>&1 | tee ../reports/linux-ci/cargo-test.log
      - name: Rust Flutter köprüsü kontrolü
        run: cargo check --manifest-path app/kopru/Cargo.toml 2>&1 | tee reports/linux-ci/cargo-check.log
      - name: Flutter analiz, test ve Linux release
        env:
          AFUDESK_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.AFUDESK_GOOGLE_DESKTOP_CLIENT_ID }}
          AFUDESK_GOOGLE_WEB_CLIENT_ID: ${{ vars.AFUDESK_GOOGLE_WEB_CLIENT_ID }}
          AFUDESK_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.AFUDESK_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: bash scripts/linux/build.sh 2>&1 | tee reports/linux-ci/flutter-build.log
      - name: Gerçek ekran ve girdi smoke derlemesi
        run: |
          cargo build --release --manifest-path rust/Cargo.toml --example linux_smoke
          g++ -std=c++14 -Wall -Wextra -Werror app/linux/runner/google_secure_storage.cc \
            app/linux/tests/google_secure_storage_test.cc $(pkg-config --cflags --libs libsecret-1) \
            -o reports/linux-ci/secure-storage-test
      - name: Debian v0.1.0 paketi
        run: bash scripts/linux/package.sh "$PWD/app/build/linux/x64/release/bundle" "$PWD/reports/linux-ci" 2>&1 | tee reports/linux-ci/package.log
      - name: Debian kurulum ve kaldırma doğrulaması
        run: |
          sudo apt-get install -y ./reports/linux-ci/afudesk_0.1.0_amd64.deb
          test -x /opt/afudesk/afudesk
          test -x /usr/bin/afudesk
          test -f /usr/share/applications/afudesk.desktop
          dpkg-query -W afudesk | tee reports/linux-ci/deb-installed.txt
          ldd /opt/afudesk/afudesk | tee reports/linux-ci/ldd.txt
          ! grep -q 'not found' reports/linux-ci/ldd.txt
      - name: Gerçek Xvfb ekranı, Enigo girdisi, Secret Service ve kurulu Flutter pencere testi
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x800x24 -ac +extension RANDR' \
            dbus-run-session -- bash scripts/linux/smoke.sh "$PWD/reports/linux-ci" /usr/bin/afudesk \
            2>&1 | tee reports/linux-ci/session.log
      - name: Debian paketini kaldırma
        if: always()
        run: |
          if dpkg-query -W -f='${Status}' afudesk 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get remove -y afudesk
            test ! -e /opt/afudesk/afudesk
            test ! -e /usr/bin/afudesk
            printf 'PASS: package removed\n' > reports/linux-ci/deb-removed.txt
          fi
      - name: Linux sonuç kaydı
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports/linux-ci
          printf 'job_status=%s\nrunner=%s\n' "$JOB_STATUS" "$RUNNER_OS" > reports/linux-ci/job-status.txt
      - name: Linux paketi, bundle ve kanıtlar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AfuDesk-linux-v0.1.0-x64
          path: |
            reports/linux-ci/
            app/build/linux/x64/release/bundle/
          if-no-files-found: warn

  # WAN TEST-1: izleyici GitHub'ın makinesinde (farklı makine, farklı ağ), host
  # geliştiricinin bilgisayarında. Kod+parola `WAN_KOD` secret'ından gelir (log'a
  # yazılmaz); sonuçlar ekran görüntüsü içerdiği için `WAN_ANAHTAR` ile şifrelenir.
  wan_derle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.wan == 'derle' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: WAN test programı
        working-directory: rust
        run: cargo build --release --example wan_test --features wan_testi
      - uses: actions/upload-artifact@v4
        with:
          name: wan_test
          path: rust/target/release/examples/wan_test.exe
          retention-days: 2

  wan_baglan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.wan == 'baglan' }}
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wan_test
          run-id: ${{ inputs.derleme_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: bin
      - name: İzleyici (farklı makine, farklı ağ)
        shell: bash
        env:
          WAN_KOD: ${{ secrets.WAN_KOD }}
          WAN_ANAHTAR: ${{ secrets.WAN_ANAHTAR }}
          AFUDESK_TEST_GENEL_YOL: "1"
          AFUDESK_SADECE_RELAY: ${{ inputs.sadece_relay }}
        run: |
          mkdir -p sonuc
          printf '%s\n' "$WAN_KOD" > sonuc/kod.txt
          curl -s --max-time 10 https://api.ipify.org > sonuc/izleyici_ip.txt || true
          ./bin/wan_test.exe izle sonuc 25 > sonuc/izle.log 2>&1 || echo "izleyici çıkış kodu: $?"
          rm -f sonuc/kod.txt
          tar czf s.tgz sonuc
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:WAN_ANAHTAR -in s.tgz -out sonuc.enc
          ls -la sonuc.enc
      - uses: actions/upload-artifact@v4
        with:
          name: wan_sonuc
          path: sonuc.enc
          retention-days: 2
