[package]
name = "afudesk_kopru"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
afudesk_core = { path = "../../rust" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
anyhow = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
